name: New VINS-NEO release
description: Plan versioned AMD64 test assets and a native ARM64 release
title: "[Release] VINS-NEO "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form before creating the release commit. Pin the selected
        iros2j and iMAVROS releases with the VINS version and changelog. The
        merged final commit is then frozen for both AMD64 and ARM64 gates.

  - type: input
    id: product_version
    attributes:
      label: VINS-NEO product version
      description: Use MAJOR.MINOR.FEATURE.PATCH.
      placeholder: 1.0.3.0
    validations:
      required: true

  - type: input
    id: release_tag
    attributes:
      label: Git release tag
      description: Use vMAJOR_MINOR_FEATURE_PATCH with two-digit padding.
      placeholder: v1_00_03_00
    validations:
      required: true

  - type: textarea
    id: release_scope
    attributes:
      label: Release scope
      description: Summarize user-visible changes and the reason for the release.
    validations:
      required: true

  - type: input
    id: iros_release
    attributes:
      label: Selected stable iros2j release
      description: Recheck the official releases/latest immediately before the release commit.
      placeholder: v2.1.0.3
    validations:
      required: true

  - type: input
    id: iros_deb_version
    attributes:
      label: iros2j Debian version
      placeholder: 1.0.3-1+deb13
    validations:
      required: true

  - type: input
    id: iros_release_url
    attributes:
      label: Official iros2j release URL
      placeholder: https://github.com/Drone-Age/iros2_0/releases/tag/v2.1.0.3
    validations:
      required: true

  - type: input
    id: iros_asset_url
    attributes:
      label: Signed Debian 13 ARM64 APT snapshot URL
      placeholder: https://github.com/Drone-Age/iros2_0/releases/download/v2.1.0.3/iros2j-apt_trixie_arm64.tar.gz
    validations:
      required: true

  - type: input
    id: iros_sha256
    attributes:
      label: iros2j asset SHA-256
      description: Enter the verified 64-character lowercase digest.
    validations:
      required: true

  - type: input
    id: opencv_version
    attributes:
      label: Required OpenCV version
      placeholder: 4.10.0
    validations:
      required: true

  - type: input
    id: imavros_release
    attributes:
      label: Compatible iMAVROS release
      description: Use the immutable version tag pinned by schema 3.
      placeholder: v1.0.0.2
    validations:
      required: true

  - type: checkboxes
    id: metadata_commit
    attributes:
      label: Release commit metadata
      options:
        - label: CMake version, version.h.in tag, CHANGELOG and release manifest will be committed together.
          required: true
        - label: The selected iros2j and iMAVROS identities and SHA-256 values will be verified.
          required: true
        - label: Schema 3 pins the exact Ubuntu 24.04 AMD64 test/deployment asset names.
          required: true
        - label: The staged metadata gate will run with -Index and -VerifyAsset.
          required: true
        - label: The committed metadata gate will pass before the Git tag is created.
          required: true

  - type: checkboxes
    id: amd64_gate
    attributes:
      label: Ubuntu 24.04 AMD64 test/deployment gate
      options:
        - label: The image and Debian package will be built from the exact final commit on linux/amd64.
          required: true
        - label: colcon tests, repository contracts and real iv.dev.4.ff.1 dataset e2e will pass.
          required: true
        - label: Image, package, JSON manifest and SHA256SUMS will be retained as release assets.
          required: true
        - label: AMD64 evidence is classified as development and does not authorize the release.
          required: true

  - type: checkboxes
    id: native_gate
    attributes:
      label: Native Debian 13 ARM64 release gate
      options:
        - label: Build and tests will run from the same exact final commit natively on Debian 13 ARM64 without Docker, emulation or cross-compilation.
          required: true
        - label: colcon tests, ldd validation, package installation and ROS smoke tests will pass.
          required: true
        - label: The configured dataset test will pass.
          required: true
        - label: The generated package will depend on the exact selected iros2j closure.
          required: true

  - type: checkboxes
    id: publication
    attributes:
      label: Publication
      options:
        - label: The Git tag will be created only after both architecture gates pass on the exact final commit.
          required: true
        - label: The GitHub Release will include AMD64 test/deployment assets and ARM64 production assets/evidence.
          required: true
        - label: The published package will be verified on a clean supported Raspberry Pi OS or Debian 13 ARM64 system.
          required: true

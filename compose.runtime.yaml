name: vins-neo-runtime

x-vins-runtime: &vins-runtime
  platform: linux/arm64
  build:
    context: .
    dockerfile: Dockerfile.runtime
    args:
      DEBIAN_SUITE: trixie
      IROS_VERSION: 0.1.1
      IROS_DEB_VERSION: 0.1.1-1+deb13
      IROS_SHA256: 62ef93734ae588cb5f342e902556d4cfa7b21de071bfedfe5b72c5431e42fe25
      VINS_VERSION: 1.0.1.7
      VINS_TAG: v1_00_01_07
      VINS_SHA256: eef16d7eab2795cde5ab37501efe00f7400edaab2451039657118367e686b376
  image: vins-neo:1.0.1.7-arm64-runtime
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    DISPLAY: ${DISPLAY:-}
    QT_X11_NO_MITSHM: "1"
  volumes:
    - ${VINS_DATA_DIR:-./data}:/data:ro

services:
  manual:
    <<: *vins-runtime
    profiles:
      - manual
    stdin_open: true
    tty: true
    volumes:
      - ${VINS_DATA_DIR:-./data}:/data:ro
      - ${VINS_CONFIG_DIR:-./runtime-config}:/config
    command:
      - sleep
      - infinity

  tracker:
    <<: *vins-runtime
    command:
      - ros2
      - launch
      - feature_tracker
      - vins_feature_tracker.launch.py

  estimator:
    <<: *vins-runtime
    command:
      - ros2
      - launch
      - vins_estimator
      - euroc.launch.py

  bag:
    <<: *vins-runtime
    depends_on:
      - tracker
      - estimator
    command:
      - bash
      - -lc
      - sleep 5; exec ros2 bag play "${VINS_BAG:-/data/MH_01_easy}"

  observer:
    <<: *vins-runtime
    profiles:
      - tools
    command:
      - bash

  rviz:
    <<: *vins-runtime
    profiles:
      - gui
    command:
      - ros2
      - launch
      - feature_tracker
      - vins_rviz.launch.py
